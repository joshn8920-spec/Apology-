<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I am Sorry Miss Baig</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff5f9; --bg2:#ffe0ee; --card:#ffffff; --ink:#7a2a50; --pink:#ff6fa8; --pink-d:#e8458a; --line:#ff8fbd; --soft:#ffd3e6; --shadow:rgba(232,69,138,.25);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#2a1020; --bg2:#3d1730; --card:#4a1d3a; --ink:#ffe3f0; --pink:#ff7db3; --pink-d:#ff5a9f; --line:#ff9cc6; --soft:#6a2a50; --shadow:rgba(0,0,0,.4); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg1:#2a1020; --bg2:#3d1730; --card:#4a1d3a; --ink:#ffe3f0; --pink:#ff7db3; --pink-d:#ff5a9f; --line:#ff9cc6; --soft:#6a2a50; --shadow:rgba(0,0,0,.4); color-scheme:dark; }
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:"Fredoka","Comic Sans MS","Chalkboard SE",ui-rounded,system-ui,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--ink); display:flex; align-items:center; justify-content:center;
  overflow-x:hidden; position:relative;
}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts span{position:absolute;bottom:-40px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg)}}
.card{
  position:relative;z-index:1; width:min(92vw,620px); margin:16px; padding:clamp(20px,5vw,40px);
  background:var(--card); border:4px solid var(--line); border-radius:36px;
  box-shadow:0 10px 0 var(--soft),0 20px 40px var(--shadow); text-align:center;
}
.mascot{font-size:clamp(56px,16vw,88px);display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
h1{margin:6px 0 14px;font-size:clamp(28px,8vw,48px);line-height:1.1;color:var(--pink-d);text-shadow:3px 3px 0 var(--soft)}
p.msg{font-size:clamp(16px,4.2vw,20px);line-height:1.5;margin:0 auto 22px;max-width:46ch}
h2{font-size:clamp(20px,5.5vw,28px);margin:0 0 16px}
.btns{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;min-height:90px}
button{
  font-family:inherit;font-weight:700;cursor:pointer;border:4px solid var(--line);border-radius:999px;
  padding:.5em 1.4em;transition:font-size .35s cubic-bezier(.34,1.56,.64,1),transform .15s;
  max-width:100%;
}
button:active{transform:scale(.94)}
#yes{background:var(--pink);color:#fff;border-color:var(--pink-d);box-shadow:0 5px 0 var(--pink-d);font-size:20px}
#no{background:var(--card);color:var(--pink-d);box-shadow:0 4px 0 var(--soft);font-size:20px;position:relative}
#no.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{min-height:1.6em;margin:16px 0 0;font-size:clamp(14px,3.8vw,17px);opacity:.9}
.tear{position:fixed;z-index:50;pointer-events:none;font-size:20px;animation:fall 1.1s ease-in forwards}
@keyframes fall{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(90px) scale(.7)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(122,42,80,.35);padding:16px;box-sizing:border-box}
.overlay.show{display:flex}
.modal{background:var(--card);border:4px solid var(--line);border-radius:32px;padding:28px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 var(--soft),0 20px 50px var(--shadow);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.modal .big{font-size:60px}
.modal p{font-size:clamp(18px,5vw,22px);font-weight:600;margin:10px 0 18px;color:var(--pink-d)}
.modal button{background:var(--pink);color:#fff;border-color:var(--pink-d);box-shadow:0 4px 0 var(--pink-d);font-size:18px}
@media (prefers-reduced-motion:reduce){.hearts span,.mascot{animation:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="card">
  <div class="mascot" id="face" aria-hidden="true">🥺</div>
  <h1>I am Sorry Miss Baig</h1>
  <p class="msg">I deeply apologize for what I did from the core of my heart. I will try that it won’t happen again</p>
  <h2>Do you accept my Apology?</h2>
  <div class="btns" id="btns">
    <button id="yes">YES</button>
    <button id="no">NO</button>
  </div>
  <p class="note" id="note" aria-live="polite"></p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="big">🎉💖</div>
    <p>Thank you so much Ma’am for accepting my apology</p>
    <button id="close">Close</button>
  </div>
</div>

<script>
(function(){
  var yes=document.getElementById('yes'), no=document.getElementById('no'),
      note=document.getElementById('note'), face=document.getElementById('face'),
      overlay=document.getElementById('overlay'), closeBtn=document.getElementById('close');
  var n=0, accepted=false;
  var pleas=["Please? 🥺","I’m really sorry… 😢","Pretty please? 💔","I’ll be good, promise! 😭","The NO button is melting away… 💧","Just say yes! 🌸"];
  var faces=["🥺","😢","😭","😭","😭","😭"];

  // floating hearts
  var hb=document.getElementById('hearts'), em=['💗','💕','🌸','💖','✨'];
  for(var i=0;i<16;i++){
    var s=document.createElement('span');
    s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+'%';
    s.style.fontSize=(16+Math.random()*22)+'px';
    s.style.animationDuration=(9+Math.random()*10)+'s';
    s.style.animationDelay=(-Math.random()*14)+'s';
    hb.appendChild(s);
  }

  function sizes(){
    var yesPx=Math.min(20*(1+n*0.32), window.innerWidth*0.26);
    var noPx=Math.max(3, 20*Math.pow(0.78,n));
    yes.style.fontSize=yesPx+'px';
    no.style.fontSize=noPx+'px';
    no.style.borderWidth=Math.max(1,Math.min(4,noPx/5))+'px';
  }

  function tears(){
    var r=no.getBoundingClientRect();
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var t=document.createElement('span');
          t.className='tear'; t.textContent='💧';
          var side=i%2?0.72:0.28;
          t.style.left=(r.left+r.width*side+(Math.random()*10-5))+'px';
          t.style.top=(r.top+r.height*0.5)+'px';
          document.body.appendChild(t);
          setTimeout(function(){t.remove()},1200);
        }, i*90);
      })(i);
    }
  }

  no.addEventListener('click',function(){
    if(accepted) return;
    n++;
    no.classList.remove('shake'); void no.offsetWidth; no.classList.add('shake');
    sizes(); tears();
    note.textContent=pleas[Math.min(n-1,pleas.length-1)];
    face.textContent=faces[Math.min(n-1,faces.length-1)];
  });

  window.addEventListener('resize',sizes);

  // fireworks
  var cv=document.getElementById('fx'), ctx=cv.getContext('2d'), parts=[], running=false, dpr=1;
  function fit(){
    dpr=window.devicePixelRatio||1;
    cv.width=window.innerWidth*dpr; cv.height=window.innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit(); window.addEventListener('resize',fit);
  var cols=['#ff6fa8','#ff9cc6','#ffd1e6','#ffffff','#ffd966','#ff4d94','#c77dff'];
  function burst(x,y){
    var c1=cols[Math.floor(Math.random()*cols.length)], c2=cols[Math.floor(Math.random()*cols.length)];
    for(var i=0;i<70;i++){
      var a=Math.random()*Math.PI*2, sp=1.5+Math.random()*5;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,d:0.012+Math.random()*0.014,c:i%2?c1:c2,r:2+Math.random()*2});
    }
  }
  function loop(){
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
    ctx.globalCompositeOperation='lighter';
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.vx*=0.985; p.life-=p.d;
      if(p.life<=0){parts.splice(i,1);continue}
      ctx.globalAlpha=p.life; ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    if(running||parts.length) requestAnimationFrame(loop);
  }
  function startFireworks(){
    running=true; loop();
    var count=0;
    var iv=setInterval(function(){
      burst(window.innerWidth*(0.1+Math.random()*0.8), window.innerHeight*(0.1+Math.random()*0.5));
      if(++count>14){clearInterval(iv); running=false;}
    },350);
    burst(window.innerWidth/2, window.innerHeight*0.35);
  }

  yes.addEventListener('click',function(){
    if(accepted) return;
    accepted=true;
    no.style.display='none';
    face.textContent='🥰';
    note.textContent='Yay! 💖';
    startFireworks();
    setTimeout(function(){overlay.classList.add('show')},700);
  });
  closeBtn.addEventListener('click',function(){overlay.classList.remove('show')});
  sizes();
})();
</script>
</body>
</html>
